name: Release Candidate

on:
  workflow_run:
    workflows: [Release Please]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  detect-changes:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    name: Detect Source Changes
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_SHA }}

      - name: Check for Source Changes
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          COMMIT_MSG=$(git log -1 --format=%B)
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Workflow triggered manually via workflow_dispatch. Forcing build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$COMMIT_MSG" =~ ^chore\(main\):\ release || "$COMMIT_MSG" =~ ^chore:\ release ]]; then
            echo "Release commit detected. Skipping release candidate."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --tags --force

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            echo "Last tag found: $LAST_TAG"
            CHANGES=$(git diff --name-only "$LAST_TAG"..HEAD -- backend/ web/ Makefile go.work* || true)
          else
            echo "No prior tag found. Building initial release candidate."
            CHANGES="initial"
          fi

          if [ -n "$CHANGES" ]; then
            echo "Detected source changes since $LAST_TAG:"
            echo "$CHANGES"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No source changes in backend/, web/, Makefile, or go.work* since $LAST_TAG. Skipping build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  release-candidate:
    name: Build and Publish Release Candidate
    needs: detect-changes
    if: needs.detect-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_SHA }}

      - name: Fetch all git tags
        run: git fetch --tags --force

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Compute Release Candidate Metadata
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          RELEASE_BRANCH=release-please--branches--main--components--agentic-lens
          PR_HEAD=$(gh api --method GET --paginate "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f base=main -f "head=${GITHUB_REPOSITORY%/*}:$RELEASE_BRANCH" \
            --jq '.[] | select(.head.repo.full_name == env.GITHUB_REPOSITORY and .head.ref == "release-please--branches--main--components--agentic-lens" and .base.ref == "main" and any(.labels[]; .name == "autorelease: pending")) | .head.sha')
          if [ -z "$PR_HEAD" ]; then
            echo "No pending Release Please PR; skipping candidate."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$PR_HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid or ambiguous release PR head" >&2; exit 1; }
          TARGET=$(gh api --method GET "repos/$GITHUB_REPOSITORY/contents/.release-please-manifest.json" \
            -f "ref=$PR_HEAD" --jq '.content | @base64d | fromjson | .["."] | select(type == "string" and test("^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)\\z"))')
          [[ "$TARGET" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Invalid root release version" >&2; exit 1; }
          [[ "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid run number" >&2; exit 1; }
          SHORT_SHA=$(git rev-parse --short HEAD)
          RC_VERSION="v${TARGET}-rc.${GITHUB_RUN_NUMBER}+${SHORT_SHA}"
          {
            echo "RC_TARGET=$TARGET"
            echo "VERSION=$RC_VERSION"
            echo "GIT_COMMIT=$SHORT_SHA"
            echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_ENV"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "Release candidate version: $RC_VERSION"

      - name: Install web dependencies
        if: steps.candidate.outputs.should_publish == 'true'
        working-directory: web
        run: npm ci

      - name: Static Analysis
        if: steps.candidate.outputs.should_publish == 'true'
        run: make check

      - name: Run Test Suite
        if: steps.candidate.outputs.should_publish == 'true'
        run: make test

      - name: Cross-Compile Release Binaries
        if: steps.candidate.outputs.should_publish == 'true'
        run: make release-build VERSION="${VERSION}" GIT_COMMIT="${GIT_COMMIT}" BUILD_DATE="${BUILD_DATE}"

      - name: Package Release Archives
        if: steps.candidate.outputs.should_publish == 'true'
        run: make release-package VERSION="${VERSION}"

      - name: Verify Release Artifacts
        if: steps.candidate.outputs.should_publish == 'true'
        run: make release-verify

      - name: Recheck Release Candidate Eligibility
        id: eligibility
        if: steps.candidate.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STATUS=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" --header "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL:-https://api.github.com}/repos/$GITHUB_REPOSITORY/git/ref/tags/v$RC_TARGET")
          case "$STATUS" in
            200) echo "Stable target v$RC_TARGET already exists; skipping candidate."
                 echo "should_publish=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "should_publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Stable target check failed: HTTP $STATUS" >&2; exit 1 ;;
          esac

      - name: Publish GitHub Pre-release
        if: steps.eligibility.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ env.EXPECTED_SHA }}
          name: ${{ env.VERSION }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/bin/agentic-lens-*
            dist/agentic-lens-*.tar.gz
            dist/agentic-lens-*.zip
            dist/SHA256SUMS

      - name: Prune Older Release Candidates
        if: steps.eligibility.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP=3
          RCS=$(gh release list --limit 100 --exclude-drafts --json tagName,isPrerelease --jq '.[] | select(.isPrerelease == true and (.tagName | test("-rc\\."))) | .tagName')
          COUNT=0
          for tag in $RCS; do
            COUNT=$((COUNT + 1))
            if [ "$COUNT" -gt "$KEEP" ]; then
              echo "Pruning older release candidate: $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done
