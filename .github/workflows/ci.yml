name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Pure Go unit tests
        run: make test-unit-backend

  frontend-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: TypeScript typecheck
        run: npm run typecheck --prefix web
      - name: ESLint
        run: npm run lint --prefix web
      - name: Pure frontend unit tests
        run: npm run test:unit --prefix web

  windows-entrypoint:
    name: Windows installation and hook integration
    needs: [backend-unit, frontend-unit]
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js for transport verification
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install development transpiler dependencies
        run: npm ci --prefix web --ignore-scripts
      - name: Build canonical embedded web assets for actual application fixtures
        working-directory: web
        run: npm run build
      - name: Verify owned Git for Windows process-tree watchdog
        working-directory: backend
        run: go test ./internal/adapters/capture -run '^TestGitCheckWindowsWatchdogKillsOwnedTree$' -count=1 -timeout=60s
      - name: Verify installer inspection process ownership on Windows
        working-directory: backend
        run: go test ./internal/adapters/capture -run '^TestInstallWindowsInspectionOwnsLauncherTree$' -count=1 -timeout=60s
      - name: Exercise real PowerShell and native Windows releases
        env:
          PYTHONUTF8: '1'
        run: python scripts/tests/test_windows_distribution.py
      - name: Exercise shipped plugin process transport
        env:
          PYTHONUTF8: '1'
        run: python scripts/tests/test_windows_plugin_transport.py

  backend-check:
    name: Backend Check
    needs: [backend-unit, frontend-unit]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Backend integration and complete race coverage
        run: make backend-check

  frontend-check:
    name: Frontend Check
    needs: [backend-unit, frontend-unit]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Frontend integration tests
        run: npm run test:integration --prefix web

  distribution-check:
    name: Linux distribution and workflow integration
    needs: [backend-unit, frontend-unit]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Distribution, release guards and orchestration boundaries
        run: make test-release-workflow test-installation test-capture-distribution test-orchestration

  build-binary:
    name: Build Binary and Verify Version
    needs: [backend-check, frontend-check, distribution-check, windows-entrypoint]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci --prefix web
      - name: Build and verify the current source native
        # The installed common wrapper remains a separate exact-YAML-pin entrypoint.
        run: make verify-build
