# AgenticLens shared project policy. Values are explicit approved choices.
# Explicit shared optional-output policy; local configuration cannot override it.
generation:
  metrics:
    skills: true
    delegations: true
    anomalies: true
  feedback:
    provisional_threshold_seconds: 180
  summary:
    enabled: true
    filename: SUMMARY.md
# Exact shared release authority. Install explicitly; dispatch never downloads.
agenticlens:
  binary_dir: bin
  version: v3.0.0-rc.131+03f5b05-2-g57a3503e
# Human-readable name of the project.
project_name: AgenticLens
# Ticket identification and normalization settings.
ticket:
  # Supported ticket prefix identifiers for this repository.
  # Each literal prefix requires an explicit description; ticket_type is optional.
  prefixes:
    - prefix: AL-
      description: Core AgenticLens development features, bugfixes, and technical initiatives
    - prefix: AL2-
      description: Core AgenticLens v2 architecture, multi-project observability, and advanced debugging initiatives
    - prefix: GEN-
      description: General multi-agent engineering tasks and ad-hoc untracked work
      ticket_type: chore
    - prefix: MGT-
      description: Management tasks, pull request coordination, integration reviews, and delivery planning
      ticket_type: chore
    - prefix: PO-
      description: Product Owner specifications, requirements definitions, and roadmap breakdowns
      ticket_type: docs
    - prefix: FIX-
      description: Bug fixes, defect remediation, and corrective patches
      ticket_type: fix
  # Ignore case while matching; preserve recorded ticket spelling.
  case_insensitive: true
# Workspace storage and ticket artifact definitions.
workspaces:
  # Directory where ticket artifacts and session telemetry ledgers are stored.
  dir: alspaces
  # Configured documentation and process artifacts tracked inside ticket workspaces.
  artifacts:
    - path: CONTRACT.md
      title: Technical Contract
      description: Frozen technical contract and acceptance boundaries
    - path: SUMMARY.md
      title: Work Summary
      description: Implementation summary log and verification records
# OpenCode SQLite database connectivity and timeout parameters.
database:
  # SQLite busy handler wait timeout in milliseconds.
  busy_timeout_ms: 5000
# Live session observability and real-time streaming engine configuration.
live:
  # Window in seconds within which a session is considered actively running.
  active_threshold_seconds: 300
  # SQLite polling interval in milliseconds for live session updates.
  poll_interval_ms: 2000
# Automated anomaly detection rules governing offline generation and live stream monitoring.
anomaly_thresholds:
  # Time in seconds without session turn activity before flagging a stall anomaly.
  stall_threshold_seconds: 120
  # Minimum calls to a tool before evaluating its failure rate.
  error_rate_min_calls: 5
  # Failure-rate ratio triggering a warning (0.35 = 35%).
  error_rate_threshold: 0.35
  # Failure-rate ratio triggering a critical alert (0.70 = 70%).
  error_rate_critical_threshold: 0.7
  # Consecutive tool errors thresholds triggering warning and critical alerts.
  consecutive_errors_streak_warning: 4
  consecutive_errors_streak_critical: 8
  # Fixed context ceiling token thresholds triggering warning and critical alerts.
  context_ceiling_warning_tokens: 250000
  context_ceiling_critical_tokens: 450000
  # Token usage surge: explicit absolute turn usage and successive context-growth token counts.
  turn_usage_warning_tokens: 60000
  turn_usage_critical_tokens: 120000
  context_growth_warning_tokens: 80000
  context_growth_critical_tokens: 120000
  # Tool thrashing minimum and critical failure frequencies.
  tool_thrashing_min_failures: 3
  tool_thrashing_critical_failures: 5
# Git commit diff analysis and code classification glob patterns.
code_metrics:
  # Upstream comparison base branch for commit diff extraction (e.g. origin/main or main).
  # Required explicit Git ref; fresh calculations fail if it cannot resolve, without probing or fetching.
  base_branch: origin/main
  production:
    include:
      - backend/**/*.go
      - web/src/**/*.ts
      - web/src/**/*.tsx
      - web/src/**/*.css
      - web/index.html
    exclude:
      - '**/*_test.go'
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - '**/*.spec.ts'
      - '**/*.spec.tsx'
      - '**/testdata/**'
      - '**/__tests__/**'
      - web/src/test/**
  tests:
    include:
      - '**/*_test.go'
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - '**/*.spec.ts'
      - '**/*.spec.tsx'
      - '**/testdata/**'
      - '**/__tests__/**'
      - web/src/test/**
    exclude:
      - alspaces/**
# Bridge definitions mapping agent persona names to canonical AgentRole enums.
# Canonical domain roles: orchestrator, planner, coder, tester, reviewer.
role_mappings:
  build: orchestrator
  coder: coder
  orchestrator: orchestrator
  planner: planner
  reviewer: reviewer
  tester: tester
# Configurable sequence for sorting agent roles in CLI tables and metric cards.
# Roles appearing here are sorted first in this exact order; unlisted roles follow alphabetically.
role_order:
  - orchestrator
  - planner
  - coder
  - tester
  - reviewer
