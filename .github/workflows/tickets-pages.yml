name: Ticket roadmap pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tickets-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Ruby and pinned Jekyll dependencies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: .github/pages
      - name: Test native Jekyll output
        env:
          BUNDLE_GEMFILE: .github/pages/Gemfile
        run: bundle exec ruby .github/pages/tests/site_test.rb
      - name: Build ticket pages
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          BUNDLE_GEMFILE: .github/pages/Gemfile
        run: >-
          bundle exec ruby .github/pages/build.rb
          --repository "$REPOSITORY"
          --revision "$REVISION"
          --base-path "/$REPOSITORY_NAME"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/tickets-site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ticket pages
        id: deployment
        uses: actions/deploy-pages@v4
