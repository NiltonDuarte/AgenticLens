<svg xmlns="http://www.w3.org/2000/svg" width="600" height="470" viewBox="0 0 600 470" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative team telemetry</title>
  <desc id="desc">Four conceptual panels show skill activity, agent roles, model use and context growth. They connect to a shared project record for comparison across tickets. Shapes are illustrative and contain no measured values.</desc>
  <rect width="600" height="470" fill="#111726"/>
  <g font-family="system-ui, sans-serif">
    <text x="28" y="39" fill="#94a3b8" font-size="14" letter-spacing="1.5">A SHARED VIEW OF AGENTIC WORK</text>
    <g fill="#182238" stroke="#243049"><rect x="24" y="60" width="266" height="141" rx="7"/><rect x="310" y="60" width="266" height="141" rx="7"/><rect x="24" y="219" width="266" height="141" rx="7"/><rect x="310" y="219" width="266" height="141" rx="7"/></g>
    <g fill="#f1f5f9" font-size="18" font-weight="600"><text x="43" y="91">Skills</text><text x="329" y="91">Agents &amp; roles</text><text x="43" y="250">Models</text><text x="329" y="250">Context use</text></g>
    <g fill="#94a3b8" font-size="13"><text x="43" y="113">Recorded invocations</text><text x="329" y="113">Follow the handoffs</text><text x="43" y="272">Activity across models</text><text x="329" y="272">Inspect window pressure</text></g>
    <g fill="#3b82f6"><rect x="43" y="131" width="185" height="10" rx="3"/><rect x="43" y="151" width="133" height="10" rx="3"/><rect x="43" y="171" width="157" height="10" rx="3"/></g>
    <path d="M348 153h186" stroke="#60a5fa" stroke-width="2"/>
    <g fill="#111726" stroke="#60a5fa" stroke-width="2"><circle cx="348" cy="153" r="12"/><circle cx="410" cy="153" r="12"/><circle cx="472" cy="153" r="12"/><circle cx="534" cy="153" r="12"/></g>
    <g fill="#94a3b8" font-size="10" text-anchor="middle"><text x="348" y="185">Plan</text><text x="410" y="185">Code</text><text x="472" y="185">Test</text><text x="534" y="185">Review</text></g>
    <g fill="#3b82f6"><rect x="43" y="292" width="49" height="47" rx="4"/><rect x="105" y="308" width="49" height="31" rx="4"/></g>
    <rect x="167" y="283" width="49" height="56" rx="4" fill="#38bdf8"/>
    <path d="M329 339h224 M329 293h224" stroke="#243049"/>
    <path d="M333 331l32-8 32 4 32-27 32 11 32-17 32-8 23 6" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <rect x="24" y="383" width="552" height="58" rx="7" fill="#182238" stroke="#243049"/>
    <text x="43" y="408" fill="#f1f5f9" font-size="15" font-weight="600">Sessions → tickets → shared project history</text>
    <text x="43" y="429" fill="#94a3b8" font-size="11">CONCEPTUAL VIEWS · NO MEASURED VALUES</text>
  </g>
</svg>
