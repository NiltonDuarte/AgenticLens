name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  windows-entrypoint:
    name: Windows installation and hook integration
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js for transport verification
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install development transpiler dependencies
        run: npm ci --prefix web --ignore-scripts
      - name: Build canonical embedded web assets for actual application fixtures
        working-directory: web
        run: npm run build
      - name: Verify owned Git for Windows process-tree watchdog
        working-directory: backend
        run: go test ./internal/adapters/capture -run '^TestGitCheckWindowsWatchdogKillsOwnedTree$' -count=1 -timeout=60s
      - name: Verify installer inspection process ownership on Windows
        working-directory: backend
        run: go test ./internal/adapters/capture -run '^TestInstallWindowsInspectionOwnsLauncherTree$' -count=1 -timeout=60s
      - name: Exercise real PowerShell and native Windows releases
        env:
          PYTHONUTF8: '1'
        run: python scripts/tests/test_windows_distribution.py
      - name: Exercise shipped plugin process transport
        env:
          PYTHONUTF8: '1'
        run: python scripts/tests/test_windows_plugin_transport.py

  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Backend Go Checks
        # Shares the local Makefile asset prerequisite before vet and tests.
        run: make backend-check

  frontend-check:
    name: Frontend Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: TypeScript Typecheck
        working-directory: web
        run: npm run typecheck

      - name: ESLint
        working-directory: web
        run: npm run lint

      - name: Frontend Unit Tests
        working-directory: web
        run: npm test

  build-binary:
    name: Build Binary and Verify Version
    needs: [backend-check, frontend-check]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build and verify the current source native
        # verify-build executes the host binary produced by this build directly.
        # The installed common wrapper remains a separate exact-YAML-pin entrypoint.
        run: make verify-build
