[project]
name = "agentic-lens"
version = "0.1.0"
description = "Agentic Development Metrics Visualization Dashboard"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "streamlit>=1.42.0",
    "pydantic>=2.10.0",
    "pandas>=2.2.0",
    "altair>=5.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
agentic-lens = "agentic_lens.presentation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agentic_lens"]

[tool.ruff]
target-version = "py314"
line-length = 88
