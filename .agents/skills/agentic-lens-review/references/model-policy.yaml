version: 1
# Coordinator input, not AgenticLens runtime configuration.
profiles:
  sol_6_1_high:
    provider_instance_id: codex
    model: gpt-6.1-sol
    reasoning_effort: high
  luna_6_medium:
    provider_instance_id: codex
    model: gpt-6-luna
    reasoning_effort: medium
# Every selected reviewer, including specialists and narrow reviews, runs all profiles.
default_profiles:
  - sol_6_1_high
  - luna_6_medium
# Optional explicit persona-name -> profile-ID list; replaces defaults for that persona.
# Empty lists are invalid. Policy changes must preserve the user's current requirements.
reviewer_overrides: {}
