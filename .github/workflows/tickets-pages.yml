name: Ticket roadmap pages

# Pages publishes only the main portal. Pull requests do not trigger this workflow.
on:
  push:
    branches: [main]
  # Manual republication of main and recovery reruns. Dispatch from main.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      main_revision: ${{ steps.resolve.outputs.main_revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test trusted publication composition
        run: python3 .github/pages/tests/preview_test.py
      - name: Resolve current main
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/pages/preview.py resolve

  production:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.main_revision }}
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Build main with its pinned dependencies
        env:
          BUNDLE_GEMFILE: .github/pages/Gemfile
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ needs.resolve.outputs.main_revision }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          bundle config set --local path vendor/bundle
          bundle install
          bundle exec ruby .github/pages/tests/site_test.rb
          bundle exec ruby .github/pages/build.rb --roadmap alspaces/plan --repository "$REPOSITORY" --revision "$REVISION" --base-path "/$REPOSITORY_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: portal-production
          path: dist/tickets-site
          include-hidden-files: true
          retention-days: 7

  publish:
    needs: [resolve, production]
    runs-on: ubuntu-latest
    # The lock includes state read, composition, deployment and state retention.
    concurrency:
      group: portal-pages-publication
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # A re-run attempt uploads a second github-pages artifact, which
      # deploy-pages refuses after the pending marker is recorded.
      - name: Refuse re-run attempts
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$RUN_ATTEMPT" != "1" ]; then
            echo "::error::Re-runs cannot publish Pages. Dispatch a new run of this workflow from main instead."
            exit 1
          fi
      - name: Check out trusted workflow scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: portal-production
          path: ${{ runner.temp }}/portal-production
      - name: Load durable static publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/pages/preview.py load-state --directory "$RUNNER_TEMP/portal-state"
      - name: Validate current revision and compose static output
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_REVISION: ${{ needs.resolve.outputs.main_revision }}
        run: >-
          python3 .github/pages/preview.py prepare
          --production "$RUNNER_TEMP/portal-production"
          --previous "$RUNNER_TEMP/portal-state/site"
          --output "$RUNNER_TEMP/portal-publication"
          --main-revision "$MAIN_REVISION"
      - name: Keep recoverable composition before deployment
        uses: actions/upload-artifact@v4
        with:
          name: portal-publication-recovery
          path: ${{ runner.temp }}/portal-publication
          include-hidden-files: true
          retention-days: 90
      - name: Prepare public artifact without private publication metadata
        run: |
          cp -R "$RUNNER_TEMP/portal-publication" "$RUNNER_TEMP/portal-public"
          rm "$RUNNER_TEMP/portal-public/.portal-state.json"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/portal-public
      # The artifact service can report a finalized upload as missing for a
      # short time. Read it again after bounded waits before recording the
      # transaction; every attempt reads the same artifact and uploads nothing.
      - name: Confirm Pages artifact is readable
        id: readable
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/portal-pages-check
      - name: Wait before reading the Pages artifact again
        if: steps.readable.outcome == 'failure'
        run: sleep 20
      - name: Confirm Pages artifact is readable (second attempt)
        id: readable-again
        if: steps.readable.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/portal-pages-check
      - name: Wait longer before the final read
        if: steps.readable-again.outcome == 'failure'
        run: sleep 60
      - name: Confirm Pages artifact is readable (final attempt)
        if: steps.readable-again.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/portal-pages-check
      - name: Record publication transaction before deploying
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/pages/preview.py begin-state --directory "$RUNNER_TEMP/portal-state"
      - name: Deploy ticket pages
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Retain successfully published static state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/pages/preview.py save-state --directory "$RUNNER_TEMP/portal-state" --site "$RUNNER_TEMP/portal-publication"
